name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build with Command Line Tools script
        run: ./build.sh
      - name: Build universal app
        run: |
          xcodebuild -project CapsLockSwitcher.xcodeproj -scheme CapsLockSwitcher \
            -configuration Release -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO build
      - name: Verify and package
        run: |
          app="build/Build/Products/Release/CapsLockSwitcher.app"
          test -x "$app/Contents/MacOS/CapsLockSwitcher"
          lipo "$app/Contents/MacOS/CapsLockSwitcher" -verify_arch arm64
          lipo "$app/Contents/MacOS/CapsLockSwitcher" -verify_arch x86_64
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" > build/entitlements.plist
          python3 - <<'PY'
          import plistlib
          import re
          from pathlib import Path
          data = Path("build/entitlements.plist").read_bytes()
          entitlements = plistlib.loads(data) if data.strip() else {}
          assert not entitlements.get("com.apple.security.app-sandbox", False), "IOHIDSystem access and hidutil require an unsandboxed app"
          project = Path("CapsLockSwitcher.xcodeproj/project.pbxproj").read_text()
          setting = lambda key: re.search(rf"{key} = ([^;]+);", project).group(1).strip('"')
          info = plistlib.loads(Path("build/Build/Products/Release/CapsLockSwitcher.app/Contents/Info.plist").read_bytes())
          assert info["CFBundleShortVersionString"] == setting("MARKETING_VERSION"), info["CFBundleShortVersionString"]
          assert info["LSMinimumSystemVersion"] == setting("MACOSX_DEPLOYMENT_TARGET"), info["LSMinimumSystemVersion"]
          PY
          ditto -c -k --keepParent "$app" CapsLockSwitcher.app.zip
          shasum -a 256 CapsLockSwitcher.app.zip
      - name: Check Caps Lock state
        run: |
          swiftc CapsLockSwitcher/CapsLockController.swift Tests/CapsLockToggle/main.swift -o build/check-caps-lock
          build/check-caps-lock
      - uses: actions/upload-artifact@v4
        with:
          name: capslockswitcher-release
          path: CapsLockSwitcher.app.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: capslockswitcher-release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" CapsLockSwitcher.app.zip
          --verify-tag --title "CapsLockSwitcher $RELEASE_TAG"
          --notes "Caps Lock switches between two layouts via a system hot key, so it keeps working while any app holds Secure Input. No Accessibility permission needed. Hold Caps Lock, Shift + Caps Lock or Command + Caps Lock for uppercase. Universal Intel and Apple Silicon build; ad-hoc signed, not notarized."
